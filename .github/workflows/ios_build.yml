name: "Free Unsigned iOS Export"
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2

      - name: Setup Godot Engine Environment
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          include-templates: true 

      - name: Auto-Detect Project Path and Compile
        run: |
          mkdir -p ios
          
          # 💡 This smart script searches your whole repo to find where project.godot lives!
          PROJECT_PATH=$(find . -name "project.godot" -maxdepth 3 -print -quit | xargs dirname)
          echo "Found Godot project root at: $PROJECT_PATH"
          
          # Change directory to your actual project folder before exporting
          cd "$PROJECT_PATH"
          
          # Force copy export presets to ensure Godot sees them
          cp -f export_presets.cfg . || echo "Presets already in place"
          
          # Compile using fallback configurations
          godot --headless --verbose --export-release "iOS" ./ios/game.xcodeproj || \
          godot --headless --verbose --export-release "ios" ./ios/game.xcodeproj || \
          godot --headless --verbose --export-release "iOS" game.xcodeproj

      - name: Compress Unsigned App Directory
        run: |
          # Finds and compresses the generated xcode project wherever it landed
          find . -name "*.xcodeproj" -type d
          zip -r ios_xcode_project.zip . -i "*.xcodeproj*" || zip -r ios_xcode_project.zip .

      - name: Upload Exported Files to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-project
          path: ios_xcode_project.zip
